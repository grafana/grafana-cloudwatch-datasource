name: Plugins - CI
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      id-token: write
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v10.1.0
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      playwright-secrets: |
        ACCESS_KEY=cloudwatch:secure_accessKey
        SECRET_KEY=cloudwatch:secure_secretKey
