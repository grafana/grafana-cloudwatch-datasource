name: Plugins - CI
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      id-token: write
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@1.1.2
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      node-version: '22'
      golangci-lint-version: '2.0.2'
