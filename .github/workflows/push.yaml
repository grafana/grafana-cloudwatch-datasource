name: Plugins - CI
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      id-token: write
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@09b221c19c8df664e65c7d4be38b440611025f09 # ci-cd-workflows/v3
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      golangci-lint-version: '2.0.2'
