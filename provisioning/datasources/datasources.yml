apiVersion: 1

datasources:
  - name: 'grafana-cloudwatch-datasource'
    uid: 'cloudwatch-e2e'
    type: 'cloudwatch'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      authType: 'keys'
      defaultRegion: 'us-east-1'
      endpoint: 'http://ministack:4566'
      customMetricsNamespaces: 'E2E/Demo'
    secureJsonData:
      accessKey: 'test'
      secretKey: 'test'
